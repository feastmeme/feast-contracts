  - id: P27
    statement: >-
      Nobody, the guardian included, can move funds OR MOVE A PRICE. The guardian holds exactly
      two powers - a one-way stop on coin creation and a bounded pause of outflows - and neither
      moves a token, changes a share, or shifts any price or deadline. **The price clause is not
      decoration**: the v1.6.12 round found that a freeze stopped the sink's buyers and not its
      descent, so seventy-two hours of brake halved the price seventy-two times and the guardian
      could buy at the number its own pause produced. EVERY clock a freeze can reach measures OPEN
      TIME only: the sink's descent AND ITS FLOOR, the emission claim grace, settlement's pricing
      grace, the platform price's aging, and the two ninety-day windows. Each was found by the
      round after the previous fix, because each fix went to the sites that had been reported
      rather than to the shape; `plans/audit/freeze-clock-sweep.md` is the enumeration of all 72
      clock reads in `src/`, and `tools/check-boundaries.py freeze-clocks` fails if one is added
      without a row.
      **Open time, not open BLOCKS** (v1.6.15): the block half of that rule was withdrawn because
      a contract cannot observe its chain's block rate, so a frozen-block counter can only be an
      estimate - and the estimate was short by four on BSC, which spent the whole window it
      existed to protect. A BLOCK window is anchored on an event a freeze cannot spend instead:
      the opening purchase cap arms at a pool's first SERVED swap, one site for both kinds of
      pool, so there is no clock between the arming and the check.
      **THE ONLY FREEZE IS ALL-SCOPE; it moves every clock it refuses, and no price outside
      it** (v1.6.17, owner ruling). ~~v1.6.15's per-scope accounting, and v1.6.16's
      `frozenSecondsFor(poolId)` / `unfrozenAtFor(poolId)`~~ — RETIRED 2026-09-22 with the
      pool-scoped freeze itself. The surgical freeze was the instrument every defeat of the
      opening purchase cap needed: five redesigns, each beaten by a guardian that could stop
      everyone else in one pool while still trading there. A freeze covering everything refuses
      the guardian's own trades too, so it cannot be used to clear a room. One counter, one
      resume instant, one predicate.
      What it costs, recorded rather than glossed: a defect in one coin's pool can only be
      answered by pausing outflows everywhere, and the only freeze also halts coin creation for
      as long as it lasts - which a pool-scoped freeze never did.
      **And no freeze may be placed in the block an unfreeze cleared** (v1.6.18). Removing the
      scope stopped the guardian standing OUTSIDE a freeze; it did not stop it standing BETWEEN
      two, and one transaction of unfreeze/trade/freeze served an opening block no stranger
      could reach - the sixth redesign of the cap falling to the same shape as the five before
      it. The bracket can no longer close in the block it opened.
      **And EVERY ending stamps it, not only an unfreeze** (v1.6.19): the stamp moved into
      _clear(), which unfreeze and expire share - and a LAPSE passes through neither, because a
      freeze that runs out has no transaction in it. So a lapse gets one: settleLapsed(),
      permissionless, with freeze() refusing until it has happened. The bound that remains is
      stated: the guardian may still TRADE in the block a lapse opens, but cannot close the
      bracket behind itself, so that block is open to every stranger and taking it needs
      BLOCK-BUILDER COLLUSION. Operational cost, recorded: every lapsed freeze needs a settling
      transaction before the guardian can freeze again.
      **Anything measured against an oracle AVERAGE waits a full TWAP_WINDOW of OPEN time**
      (v1.6.16, ruling 3, and it stands): a freeze writes no observations, so an average drifts
      onto the pinned spot with no trade at all and a price a bound REFUSED becomes one it
      accepts. All three reads of an average in `src/` carry that condition, and
      `audit/guardian-reads.allow` enumerates every read of a guardian counter or an average
      with its decision, so a fourth site cannot be added without one -
      `tools/check-boundaries.py guardian-reads`. v1.6.16 needed a per-pool resume instant
      here; v1.6.17 removed the scope that made one necessary, so they all read
      `allUnfrozenAt()`.
    severity_if_broken: HIGH
    witnesses:
      - test/FeastGuardian.t.sol:FeastGuardianTest.testFuzz_theGuardianCannotMoveAWei
      - test/FeastGuardian.t.sol:FeastGuardianTest.test_aStrangerIsRefused
