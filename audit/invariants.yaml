  - id: P30
    statement: >-
      An empty genesis-partner slot may be filled exactly once, by the team multisig - the same
      address that holds the guardian's brake, read from the guardian so the two cannot differ -
      and only inside the guardian's own 90-day window. A slot filled at genesis or filled since
      is immutable: nobody can replace, remove or reassign a partner. The assignment moves no
      value, the six-month unlock clock is not restarted, and an emission week that had already
      closed when a slot was filled counts zero toward it. A slot nobody fills burns once the
      window closes, so no grant strands.
    severity_if_broken: HIGH
