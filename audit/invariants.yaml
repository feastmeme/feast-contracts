  - id: P19
    statement: >-
      The sink sells any asset but the platform coin. A descent runs only over a lot that holds
      something and prices the lot it was opened over: a lot holding at least SINK_REOPEN_MULTIPLE
      times what it held when its descent began is priced from the start price again, by the view
      and by a take alike (v1.6.2).
      **A SALE RAISES THE CURVE AND DOES NOT RESTART IT** (v1.6.19): `anchor` is multiplied by
      1 + amountOut/held and the clock is left where it was, so the descent is MEMORYLESS - a
      take at any moment leaves the lot on the same curve and a take of nothing changes nothing.
      Before this, re-anchoring reset the clock; the curve is exponential by halvings and LINEAR
      inside each one, a chord lies ABOVE the exponential it spans, and a drip of one-unit takes
      never reached the cheap end of one. Measured 2.03x the honest price after six hours of
      takes every thirty minutes, and /burn gives anyone the button (HK19-claude MEDIUM, v1.6.16
      round). After a sale the price does not fall below that sale's price
      halved SINK_FLOOR_HALVINGS times - weighted by the share of the lot that sale took - and that
      floor itself halves every SINK_FLOOR_HALF_LIFE since the sale, so neither a dust purchase nor
      the passage of time pins a lot above the market (v1.6.2, H2 and round 4). THAT SENTENCE IS
      EXACT ONLY IN REAL NUMBERS; what the code keeps is stated in the two clauses below, each with
      the truncation it carries. Read them as the invariant, not as a retraction of this line. A take may RAISE
      that floor and never lower it, and a take that does not raise it does not restart its clock
      either. The floor a real sale set is held exactly on its own clock; a sale that DOES raise it
      is exactly not-lower at the sale and within one raw price unit of the old curve afterwards,
      the same truncation the slack below covers (v1.6.3 round 2, r2h). A later, lower
      sale's own-clock floor is held to within the decay curve's chord gap - never worse than 8/9
      of it LESS AN ABSOLUTE SLACK OF FOUR RAW PRICE UNITS, at half a half-life on each clock
      (v1.6.3, CA-b229a31396, and round 1 r1v for the slack). The 8/9 is a statement about real
      numbers; the floor is read by a shift and a truncated linear step, twice over, and at
      exactly half a half-life on each clock the real inequality is tight, so the truncations
      cross it at EVERY magnitude. Where four units matter the relative half says nothing and the
      slack is the whole promise. Four units of Q128 price is NOT economically zero on a large
      lot - a take pays amountOut x price / 2^128, so four units over N raw units is up to
      4N / 2^128 platform coin, thousands of FEAST for the largest lots. It is the price of
      reading a decaying floor with integer arithmetic, stated rather than dressed up (v1.6.3
      round 3, r3v). Opening a new descent clears the
      floor the last one earned, and nothing else does. No descent runs before the sink's opening: the
      genesis key names the launch window once, the sink checks that window's role and coin and
      reads its close, and that close is the opening - until it, the coin exists but nobody can
      hold any (v1.6.2, rounds 5 and 6). The price
      is never zero, and everything the sink is paid is burned.
    severity_if_broken: HIGH
    witnesses:
