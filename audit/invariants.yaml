  - id: P28
    statement: >-
      The brake is bounded on chain: at most 72 hours per freeze, expiring by itself with no
      action from anyone; at most 168 hours cumulatively over the guardian's life; and the freeze
      power ends 90 days after GENESIS - the instant the factory reports, not the guardian's own
      deploy - after which freeze reverts for ever and anyone may clear a freeze left standing.
      Before genesis the clock has not started: there is no deadline, the brake is fully live,
      and nothing that reads a deadline may act.
      **And the budget bounds the COUNT of pulls, not only their duration** (v1.6.15, owner
      ruling 5): every freeze costs at least MIN_FREEZE_CHARGE = 1 hour whatever happens, so
      `unfreeze` refunds only the tail above it and at most 168 pulls exist over the guardian's
      life. Before this, a freeze lifted in the second it was placed refunded its whole grant, so
      a freeze/unfreeze pair per block refused every guarded call ordered between them for ever
      and the 168-hour bound did not bind the one thing it exists to bound. The minimum binds the
      BUDGET and never the clocks - a one-second freeze still delays every deadline by one second
      and not by an hour. The brake is an emergency instrument: any automated caller must expect
      every pull to cost an hour of budget, and no such caller exists in this repository.
    severity_if_broken: HIGH
    witnesses:
