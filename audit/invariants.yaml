  - id: P22
    statement: >-
      The launch window's failure routes stay reachable: a seed that reverts leaves the window
      unsettled and every commit refundable; an auction nobody settles by `abandonAt` refunds
      every commit in full with no half-built pool behind it, and its coin still reaches the pool
      afterwards; a pot below `MIN_POT`, or one whose price cannot be represented, is no
      participation, never a revert, and refunds in full; and a no-commit window opens the pool
      single-sided at the price the genesis key named. (Since v1.6.24, AstraSec M-2: `settle` has
      no deadline and refunds open at `abandonAt`. Until then they opened after the grace hour,
      and a pot too small to price was refused by name. Restated in v1.6.27.) Nothing the settlement does not place is left owned by nothing, but
      for the rounding dust of quote a clearing settle leaves in the hook: at most 1e6 wei for
      any pot up to 1,000,000 BNB, and never more than a 1e-15 share of the pot at any size.
      Measured, it grows as the square root of the pot (937 wei at 1 BNB, 934,550 at 1,000,000);
      the window's own test already allowed it (`test_theWholePotIsInThePoolAsBidLiquidity`,
      under 1e6 wei), and it is tolerated rather than swept because it is worth less than any
      transaction that could move it. The coin's remainder is burned. Amended in v1.6.27 by
