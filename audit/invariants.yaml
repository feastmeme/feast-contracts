  - id: P21
    statement: >-
      Every commit in the launch window clears at one price. The pool opens at exactly that
      price, so a committer who sells at the open loses only the fee and their own impact -
      never a premium the window handed to whoever sold first. The whole pot stays in the pool
      as permanently locked bid liquidity, and the seeding writes no oracle observation, so the
      platform coin has no price the pricer will vouch for until it has actually traded.
    severity_if_broken: HIGH
    witnesses:
      - test/FeastWindowAuction.t.sol:FeastWindowAuctionTest.test_theClearingPriceIsThePotOverTheTranche
