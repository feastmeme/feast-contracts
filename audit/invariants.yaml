  - id: P6
    statement: >-
      In the opening blocks every wallet is capped at 0.5% of supply and nobody is exempt. Before the pool opens, the creator may have bought a disclosed amount of their own coin at creation, paid for in quote at the pool's own price, bounded by a constant (20% of supply) and shown on the coin page from block one.
      **The window is CAP_BLOCKS blocks from the pool's first SERVED public swap** (v1.6.15), for
      both gated and ungated pools, through one arming site - not from its creation block. A pool
      that has not traded has not opened, so a freeze cannot spend a window that has not started,
      and the creator's pre-buy does not arm it. The boundary that remains is stated in
      `plans/audit/freeze-clock-sweep.md`. **v1.6.16: the window is a COUNT of the distinct
      blocks the pool has SERVED a trade in**, not a height. A height passes whether or not
      anybody may trade, and the v1.6.15 round showed the guardian spending one with its own
      first trade plus a freeze in the same block - it does not have to predict a stranger's
      trade, it makes the trade. A frozen block serves no trade, so it does not count, and
      there is no quantity left for a freeze to spend. Several trades in one block count once;
      counting stops at CAP_BLOCKS + 1, so an ordinary trade past the window pays one SLOAD and
      no SSTORE. The creator's pre-buy counts as no block.
