  - id: P14
    statement: >-
      The claims of a week never exceed its pots; nothing is claimable before the pool opens;
      unclaimed pots burn only after grace. A settled week is settled in its QUOTE LIST as well as
      in its prices: settlement snapshots the list it priced, each distinct quote once, and the
      owed/claim path reads only that snapshot and the prices stored beside it. Nothing on that
      path asks the pricer anything after settlement - the contracts it still calls are the fee
      ledger, the hook, and the platform coin that `claim` pays in, all three immutable and
      replaceable by no lever - so nothing a pricer module says afterwards can revalue a week
      already settled (v1.6.3, CA-7e9b1e15be).
